<main id="main"><article class="tools"><h1>Sri Lakshmi Satsang</h1><div class="container-fluid">
<div class="row">
<!-- Names Section -->
<div class="col-md-3">
<div class="form-group">
<div class="row mb-3">
<div class="col-6">
<label for="batchnumber">Batch number</label><input class="form-control" id="batchnumber" name="batchnumber" placeholder="Batch Number e.g. LS1, LS2" required="" type="text"/>
</div>
<div class="col-6">
<label for="satsangdate">Satsang date</label><input class="form-control" id="satsangdate" name="satsangdate" placeholder="Satsang date e.g. 2-Sep-2025 /1 PM IST" required="" type="text"/>
</div>
</div>
<label class="form-label" for="names">Enter Names</label>
<small class="form-text text-muted">
                        *Enter <strong>NSP</strong> as first name to allocate one portion once. (optional)
                    </small>
<textarea class="form-control" id="names" name="names" rows="15"></textarea>
<div class="mt-3">
<button class="btn btn-danger btn-sm me-2" onclick="clearNames()" type="button">Clear</button>
<button class="btn btn-primary btn-sm" onclick="tempSave()" type="button">
<i class="fas fa-save"></i> Save
                        </button>
</div>
</div>
</div>
<!-- Allocation Section -->
<div class="col-md-6">
<div class="mb-3">
<button class="btn btn-success btn-sm me-2" onclick="allocate('asis')" type="button">Allocate</button>
<button class="btn btn-success btn-sm me-2" onclick="allocate('random')" type="button">Alloc Randomly</button>
<button class="btn btn-success btn-sm" onclick="allocate('shloka')" type="button">Alloc only Shloka</button>
</div>
<label class="form-label" for="allocation">Allocation</label>
<textarea class="form-control" id="allocation" name="allocation" readonly="" rows="15"></textarea>
<div class="mt-3">
<button class="btn btn-success btn-sm me-2" onclick="copyToClipboard('allocation')" type="button">
<i class="fas fa-copy"></i> Copy Allocations
                    </button>
<button class="btn btn-success btn-sm" onclick="downloadCSV()" type="button">
<i class="fas fa-download"></i> Download CSV/XL
                    </button>
</div>
</div>
<!-- Random Names Section -->
<div class="col-md-3">
<div class="mb-3">
<button class="btn btn-info btn-sm" onclick="operateNames('random')" type="button">Randomize Names</button>
</div>
<label class="form-label" for="randomnames">Randomized Names</label>
<textarea class="form-control" id="randomnames" name="randomnames" readonly="" rows="15"></textarea>
<div class="mt-3">
<button class="btn btn-info btn-sm" onclick="copyToClipboard('randomnames')" type="button">
<i class="fas fa-copy"></i> Copy Names
                    </button>
</div>
</div>
</div>
</div></article></main><footer id="contact"><h2>Contact</h2><div><a href="mailto:nsparayanam1@gmail.com">nsparayanam1@gmail.com</a> · <a href="tel:+918050935734">+91 80509 35734</a></div><p><a href="https://www.facebook.com/profile.php?id=61567852370903">Facebook</a> <a href="https://www.instagram.com/nityastotra.parayanam">Instagram</a> <a href="https://www.youtube.com/@NityaStotraParayanamNSP">YouTube</a></p></footer><script src="nspallocate.js"></script><script>loadPeople()</script></body></html>
